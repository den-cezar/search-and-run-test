name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    name: Package extension
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Build the store packages
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          for target in chromium firefox; do
            node scripts/build-package.mjs "$target"
            (cd "build/$target" && zip -qr "../../search-and-run-test-${TAG}-${target}.zip" .)
          done
          ls -l ./*.zip

      - name: Upload the packages to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" \
            "search-and-run-test-${TAG}-chromium.zip" \
            "search-and-run-test-${TAG}-firefox.zip" \
            --clobber

  publish:
    name: Publish to stores
    needs: [release-please, package]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish-stores.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
