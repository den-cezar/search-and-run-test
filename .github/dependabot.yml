version: 2
updates:
  # Keep npm dev dependencies (ESLint, etc.) up to date.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR for all minor/patch dev-dependency bumps.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Keep GitHub Actions used in workflows up to date.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
